name: Update QDII monitor data

on:
  schedule:
    # 每天 08:30 北京时间（00:30 UTC）自动抓取最新数据
    - cron: '30 0 * * *'
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths: [ 'collect.py' ]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch latest QDII data
        run: python collect.py --no-cache

      - name: Commit & push updated data
        run: |
          git config user.name 'qdii-bot'
          git config user.email 'qdii-bot@users.noreply.github.com'
          git add data/data.json
          if git diff --cached --quiet; then
            echo "no data change"
            exit 0
          fi
          git commit -m 'Auto-update QDII data'
          git push

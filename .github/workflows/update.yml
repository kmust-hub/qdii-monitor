name: Update QDII monitor data

on:
  schedule:
    # 每 6 小时自动抓取：08:30 / 14:30 / 20:30 / 02:30 北京时间（00:30 / 06:30 / 12:30 / 18:30 UTC）
    - cron: '30 */6 * * *'
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths: [ 'collect.py' ]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch latest QDII data
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
          NOTIFY_EMAILS: ${{ secrets.NOTIFY_EMAILS }}
        run: python collect.py --no-cache

      - name: Commit & push updated data
        run: |
          git config user.name 'qdii-bot'
          git config user.email 'qdii-bot@users.noreply.github.com'
          git add data/data.json
          if git diff --cached --quiet; then
            echo "no data change"
            exit 0
          fi
          git commit -m 'Auto-update QDII data'
          git push

<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QDII 海外指数申购监控 · 纳斯达克100 / 标普500</title>
  <meta name="description" content="场外 QDII 纳斯达克100、标普500 指数基金申购状态实时监控" />
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="%23111a2b"/><path d="M7 20 l6 -7 4 4 7 -9" fill="none" stroke="%23e0241b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="8" r="2.6" fill="%230a9d63"/></svg>' />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <h1>QDII 海外指数申购监控</h1>
      <span class="sub">纳斯达克100 · 标普500 场外基金</span>
    </div>
    <div class="top-actions">
      <span class="updated" id="updatedAt">—</span>
      <label class="freq">更新频率
        <select id="freq">
          <option value="3600000">1小时</option>
          <option value="43200000">12小时</option>
          <option value="86400000">24小时</option>
        </select>
      </label>
      <button class="btn ghost" id="refreshBtn" title="重新加载数据">刷新</button>
      <button class="btn ghost" id="themeBtn" title="切换主题">◐</button>
    </div>
  </header>

  <main>
    <!-- 统计卡片 -->
    <section class="stats" id="stats"></section>

    <!-- 筛选/控制 -->
    <section class="controls">
      <div class="tabs" id="indexTabs">
        <button class="tab active" data-index="all">全部</button>
        <button class="tab" data-index="nasdaq100">纳斯达克100</button>
        <button class="tab" data-index="sp500">标普500</button>
      </div>
      <button class="btn ghost" id="colBtn" title="调整列顺序">列序 ▾</button>
      <div class="col-menu" id="colMenu" hidden></div>
      <div class="search">
        <input id="search" type="search" placeholder="搜索代码 / 名称" autocomplete="off" />
      </div>
    </section>

    <!-- 主体：表格 + 变更 -->
    <section class="layout">
      <div class="table-wrap">
        <table class="ftable" id="ftable">
          <thead>
            <tr id="theadRow"></tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
        <div class="empty" id="empty" hidden>没有符合条件的基金</div>
      </div>

      <aside class="side">
        <h2 class="side-title">近期变更</h2>
        <div id="changes" class="changes"></div>
      </aside>
    </section>
  </main>

  <footer class="foot">
    <span>数据来源：公开基金接口（东方财富/天天基金）· “单日限购”为天天基金/东方财富口径（本身即第三方代销平台）；京东、蚂蚁财富、理财通等平台每日额度各平台自行展示，需登录对应 App，公开接口无法批量获取。仅供研究参考，不构成投资建议。</span>
  </footer>

  <div class="legend" id="legend"></div>
  <script src="app.js"></script>
</body>
</html>
